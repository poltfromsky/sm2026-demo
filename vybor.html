<title>Что выберешь ты? — демо блока</title>
<style>html,body{margin:0;background:#0b0d12}.spacer{height:70vh;display:flex;align-items:center;justify-content:center;color:#5c6578;font:14px system-ui,sans-serif}</style>

<!-- ===== SMF-CHOICE:START — копировать в HTML-блок Tilda (T123) отсюда ===== -->
<!--
  Блок 2 «Что выберешь ты?». Настройки (data-*):
  data-title        — заголовок
  data-left / data-right — подписи под окнами
  data-move         — сколько секунд рука едет от окна к окну
  data-hold         — сколько секунд стоит под окном
  data-speed        — скорость «раздумий» (1 = обычно)
  data-tremor       — сила дрожи пальца в пикселях (0 — без дрожи)
  data-hand-src     — ссылка на другую картинку руки (по умолчанию встроена; чёрный фон картинки растворяется)
  Рука — ИИ-генерация (маркировать в лонгриде вместе с остальным ИИ-контентом).
  Цвета — переменные --smfch-* в <style>.
-->
<section id="smfch" class="smfch"
     data-title="Что выберешь ты?" data-left="Для себя" data-right="Для работы"
     data-move="1.8" data-hold="1.4" data-speed="1" data-tremor="0.8">
  <h2 class="smfch-title"></h2>

  <div class="smfch-row">
    <!-- ЛЕВОЕ ОКНО: VR для личной жизни -->
    <figure class="smfch-win smfch-win--life" data-side="left">
      <div class="smfch-glow" aria-hidden="true"></div>
      <svg class="smfch-scene" viewBox="0 0 320 240" role="img" aria-label="VR-очки для личной жизни: путешествия, игры, музыка, кино">
        <defs>
          <linearGradient id="smfch-life-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1c2330"/><stop offset=".55" stop-color="#3a3a44"/><stop offset="1" stop-color="#76604c"/>
          </linearGradient>
          <radialGradient id="smfch-life-orb" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#e8c08f" stop-opacity=".45"/><stop offset="1" stop-color="#e8c08f" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="smfch-life-visor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b98a62"/><stop offset=".5" stop-color="#8d9c9b"/><stop offset="1" stop-color="#4c6472"/>
          </linearGradient>
          <linearGradient id="smfch-life-body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1eee8"/><stop offset="1" stop-color="#cfc8be"/>
          </linearGradient>
        </defs>
        <rect width="320" height="240" fill="url(#smfch-life-bg)"/>
        <circle class="smfch-orb" cx="250" cy="60" r="70" fill="url(#smfch-life-orb)"/>
        <circle class="smfch-orb smfch-orb--b" cx="60" cy="200" r="55" fill="url(#smfch-life-orb)" opacity=".55"/>
        <!-- искры -->
        <g class="smfch-sparks" fill="#fff">
          <circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="22" r="1.2"/><circle cx="282" cy="140" r="1.8"/>
          <circle cx="200" cy="208" r="1.3"/><circle cx="30" cy="132" r="1.1"/><circle cx="300" cy="30" r="1.2"/>
        </g>
        <!-- иконки личной жизни -->
        <g class="smfch-ic smfch-ic--1" transform="translate(42 70)"><!-- самолёт -->
          <path d="M0 10 L26 6 L36 -4 L40 -3 L34 8 L48 10 L52 6 L55 7 L52 13 L55 19 L52 20 L48 16 L34 18 L40 29 L36 30 L26 20 L0 16 Z" fill="#fff" opacity=".7"/>

        <g class="smfch-ic smfch-ic--2" transform="translate(236 168)"><!-- геймпад -->
          <rect x="0" y="0" width="54" height="28" rx="14" fill="#fff" opacity=".72"/>
          <rect x="10" y="12" width="12" height="4" rx="1" fill="#3a3a44"/><rect x="14" y="8" width="4" height="12" rx="1" fill="#3a3a44"/>
          <circle cx="38" cy="10" r="3" fill="#b98a62"/><circle cx="44" cy="17" r="3" fill="#6f8f9c"/>
        </g>
        <g class="smfch-ic smfch-ic--3" transform="translate(252 74)"><!-- нота -->
          <path d="M14 0 L32 -6 L32 22" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 0 L14 28" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="9" cy="29" rx="7" ry="5.5" fill="#fff"/><ellipse cx="27" cy="23" rx="7" ry="5.5" fill="#fff"/>
        </g>
        <g class="smfch-ic smfch-ic--4" transform="translate(30 168)"><!-- видео (кнопка «плей») -->
          <rect x="0" y="4" width="46" height="32" rx="9" fill="#fff" opacity=".72"/>
          <path d="M18 12 L31 20 L18 28 Z" fill="#b98a62"/>
        </g>
        <!-- VR-очки: яркие -->
        <g transform="translate(64 86)"><g class="smfch-vr">
          <ellipse cx="96" cy="86" rx="82" ry="8" fill="#000" opacity=".3"/>
          <path d="M14 30 C-4 34 -6 54 8 58" fill="none" stroke="#e6e0d6" stroke-width="7" stroke-linecap="round"/>
          <path d="M178 30 C196 34 198 54 184 58" fill="none" stroke="#e6e0d6" stroke-width="7" stroke-linecap="round"/>

          <rect x="18" y="18" width="156" height="50" rx="24" fill="url(#smfch-life-visor)"/>

          <circle cx="62" cy="44" r="9" fill="#fff" opacity=".18"/><circle cx="130" cy="44" r="9" fill="#fff" opacity=".18"/>
          <path d="M84 70 Q96 60 108 70" fill="#cfc8be"/>
        </g></g>
      </svg>
      <figcaption class="smfch-cap"></figcaption>
    </figure>

    <!-- ПРАВОЕ ОКНО: VR для работы -->
    <figure class="smfch-win smfch-win--work" data-side="right">
      <div class="smfch-glow" aria-hidden="true"></div>
      <svg class="smfch-scene" viewBox="0 0 320 240" role="img" aria-label="VR-очки для работы: интерфейсы, графики, рабочие панели">

          <linearGradient id="smfch-work-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0f1a26"/><stop offset="1" stop-color="#16283a"/>
          </linearGradient>
          <pattern id="smfch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0 L0 0 0 20" fill="none" stroke="#2c4a63" stroke-width=".6"/>
          </pattern>
          <linearGradient id="smfch-work-visor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a1118"/><stop offset="1" stop-color="#1d3a4d"/>
          </linearGradient>
          <linearGradient id="smfch-work-body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5a6775"/><stop offset="1" stop-color="#2b333d"/>

          <linearGradient id="smfch-scan" x1="0" y1="0" x2="0" y2="1">

          <g class="smfch-bars" fill="#7fbfd2">
            <rect x="12" y="20" width="9" height="26" rx="1.5"/><rect x="26" y="28" width="9" height="18" rx="1.5"/>
            <rect x="40" y="14" width="9" height="32" rx="1.5"/><rect x="54" y="24" width="9" height="22" rx="1.5"/>
          </g>
          <rect x="10" y="7" width="34" height="3" rx="1.5" fill="#4d7a96"/>
        </g>
        <!-- панель: график -->
        <g class="smfch-panel" transform="translate(222 22)">
          <rect width="80" height="52" rx="6" fill="#132535" stroke="#2f5873"/>
          <polyline class="smfch-line" points="8,40 22,30 34,34 48,18 60,24 72,10" fill="none" stroke="#9fcfb8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- ноутбук (сверху по центру) -->
        <g class="smfch-panel" transform="translate(126 14)">
          <rect x="8" y="0" width="52" height="34" rx="3" fill="#132535" stroke="#2f5873"/>
          <rect x="13" y="5" width="42" height="24" rx="1.5" fill="#0d1c29"/>
          <rect x="17" y="9" width="20" height="3" rx="1.5" fill="#7fbfd2"/>
          <rect x="17" y="15" width="30" height="2.5" rx="1.25" fill="#4d7a96"/>
          <rect x="17" y="20" width="24" height="2.5" rx="1.25" fill="#4d7a96"/>
          <path d="M0 37 L68 37 L63 43 L5 43 Z" fill="#2b3d4d" stroke="#2f5873"/>
          <rect x="27" y="37" width="14" height="2" rx="1" fill="#1b2a38"/>
        </g>
        <!-- рабочие документы (снизу по центру) -->
        <g class="smfch-docs" transform="translate(140 182)">
          <g transform="rotate(-7 22 22)">
            <path d="M2 2 H32 L40 10 V46 H2 Z" fill="#c9d3dc" opacity=".55"/>
          </g>
          <g transform="rotate(4 22 22)">
            <path d="M6 0 H36 L44 8 V44 H6 Z" fill="#e3e9ee"/>
            <path d="M36 0 V8 H44" fill="#b9c4cd"/>
            <g stroke="#7d8c99" stroke-width="1.6" stroke-linecap="round">
              <path d="M12 12 H30"/><path d="M12 18 H38"/><path d="M12 24 H36"/><path d="M12 30 H38"/><path d="M12 36 H26"/>
            </g>
          </g>
        </g>
        <!-- каркасный куб -->
        <g transform="translate(272 186)">
          <g class="smfch-cube" fill="none" stroke="#7fbfd2" stroke-width="1.4" opacity=".85">
            <rect x="-14" y="-14" width="20" height="20"/><rect x="-6" y="-6" width="20" height="20"/>
            <path d="M-14 -14 L-6 -6 M6 -14 L14 -6 M-14 6 L-6 14 M6 6 L14 14"/>
          </g>
        </g>
        <!-- панель: задачи -->
        <g class="smfch-panel" transform="translate(16 172)">
          <rect width="96" height="50" rx="6" fill="#132535" stroke="#2f5873"/>
          <rect x="10" y="10" width="8" height="8" rx="2" fill="#9fcfb8"/><rect x="24" y="12" width="56" height="4" rx="2" fill="#4d7a96"/>
          <rect x="10" y="22" width="8" height="8" rx="2" fill="#9fcfb8"/><rect x="24" y="24" width="44" height="4" rx="2" fill="#4d7a96"/>
          <rect x="10" y="34" width="8" height="8" rx="2" fill="none" stroke="#4d7a96"/><rect x="24" y="36" width="50" height="4" rx="2" fill="#4d7a96"/>
        </g>
        <!-- VR-очки: строгие -->
        <g transform="translate(64 86)"><g class="smfch-vr smfch-vr--work">
          <ellipse cx="96" cy="86" rx="82" ry="8" fill="#000" opacity=".35"/>
          <path d="M14 30 C-4 34 -6 54 8 58" fill="none" stroke="#3b4652" stroke-width="7" stroke-linecap="round"/>
          <path d="M178 30 C196 34 198 54 184 58" fill="none" stroke="#3b4652" stroke-width="7" stroke-linecap="round"/>
          <rect x="8" y="10" width="176" height="66" rx="18" fill="url(#smfch-work-body)"/>
          <rect x="18" y="18" width="156" height="50" rx="12" fill="url(#smfch-work-visor)"/>
          <g stroke="#7fbfd2" stroke-width="1.6" stroke-linecap="round" opacity=".9">
            <path d="M30 32 H66"/><path d="M30 40 H54"/><path d="M128 52 H162"/><path d="M140 44 H162"/>
          </g>

          <circle cx="96" cy="43" r="2.5" fill="#7fbfd2"/>
          <rect x="18" y="18" width="156" height="50" rx="12" fill="none" stroke="#7fa3bd" stroke-width="1" opacity=".5"/>
          <rect x="176" y="34" width="6" height="18" rx="2" fill="#1b232c"/>
        </g></g>
        <rect class="smfch-scanline" x="0" y="0" width="320" height="40" fill="url(#smfch-scan)"/>
      </svg>
      <figcaption class="smfch-cap"></figcaption>

<style>
#smfch{
  --smfch-bg:#0b0d12; --smfch-text:#e9ecf2; --smfch-muted:#9aa3b5;
  --smfch-life:#d9b38a; --smfch-work:#8cc4d4;
  box-sizing:border-box; position:relative; width:100%;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:56px 16px 24px; background:var(--smfch-bg); overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--smfch-text);
}
#smfch *,#smfch *::before,#smfch *::after{box-sizing:border-box}
#smfch .smfch-title{
  margin:0 0 clamp(24px,5vw,44px); text-align:center;
  font:600 clamp(30px,7vw,56px)/1.1 Georgia,"Times New Roman",serif; letter-spacing:.01em;
  opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1);
}
#smfch.is-title .smfch-title{opacity:1;transform:none}

#smfch .smfch-row{display:flex;justify-content:center;gap:clamp(12px,4vw,48px);width:100%;max-width:820px}
#smfch .smfch-win{
  --f:0; position:relative; margin:0; flex:1 1 0; max-width:360px; min-width:0;
  opacity:0; transform:translateY(24px) scale(.94);
  transition:opacity .9s ease, transform 1s cubic-bezier(.2,.8,.2,1);
}
#smfch.is-wins .smfch-win{opacity:1;transform:translateY(calc(var(--f) * -6px)) scale(calc(1 + var(--f) * .035))}
#smfch.is-wins .smfch-win--work{transition-delay:.18s}
#smfch.is-live .smfch-win{transition:opacity .9s ease, transform .25s linear}
#smfch .smfch-scene{
  display:block; width:100%; height:auto; border-radius:16px;
  box-shadow:0 24px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
}
#smfch .smfch-glow{
  position:absolute; inset:-10px; border-radius:24px; pointer-events:none; opacity:calc(var(--f) * .9);
  filter:blur(18px); z-index:-1;
}
#smfch .smfch-win--life .smfch-glow{background:radial-gradient(closest-side,rgba(217,179,138,.45),rgba(160,120,90,.15),transparent)}
#smfch .smfch-win--work .smfch-glow{background:radial-gradient(closest-side,rgba(140,196,212,.42),rgba(60,100,130,.15),transparent)}
#smfch .smfch-cap{
  margin-top:12px; text-align:center; font-size:clamp(12px,2.8vw,15px); letter-spacing:.14em; text-transform:uppercase;
  color:var(--smfch-muted); transition:color .3s ease;
}
#smfch .smfch-win--life .smfch-cap{color:color-mix(in srgb, var(--smfch-life) calc(var(--f) * 100%), var(--smfch-muted))}
#smfch .smfch-win--work .smfch-cap{color:color-mix(in srgb, var(--smfch-work) calc(var(--f) * 100%), var(--smfch-muted))}

/* Живые детали в окнах */
#smfch.is-wins .smfch-vr{animation:smfch-float 4.2s ease-in-out infinite}
#smfch.is-wins .smfch-vr--work{animation-duration:5.4s}
@keyframes smfch-float{50%{transform:translateY(-6px)}}
#smfch .smfch-ic{animation:smfch-bob 3.6s ease-in-out infinite}
#smfch .smfch-ic--2{animation-delay:-1s}#smfch .smfch-ic--3{animation-delay:-2s}#smfch .smfch-ic--4{animation-delay:-.5s}#smfch .smfch-ic--5{animation-delay:-2.6s}
@keyframes smfch-bob{50%{opacity:.75}}
#smfch .smfch-sparks circle{animation:smfch-twinkle 2.4s ease-in-out infinite}
#smfch .smfch-sparks circle:nth-child(2n){animation-delay:-1.2s}
#smfch .smfch-sparks circle:nth-child(3n){animation-delay:-.6s}
@keyframes smfch-twinkle{50%{opacity:.15}}
#smfch .smfch-orb{animation:smfch-pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#smfch .smfch-orb--b{animation-delay:-2.5s}
@keyframes smfch-pulse{50%{transform:scale(1.12);opacity:.7}}
#smfch .smfch-bars rect{transform-box:fill-box;transform-origin:bottom;animation:smfch-bar 2.8s ease-in-out infinite}
#smfch .smfch-bars rect:nth-child(2){animation-delay:-.7s}#smfch .smfch-bars rect:nth-child(3){animation-delay:-1.4s}#smfch .smfch-bars rect:nth-child(4){animation-delay:-2.1s}
@keyframes smfch-bar{50%{transform:scaleY(.55)}}
#smfch .smfch-line{stroke-dasharray:110;stroke-dashoffset:110;animation:smfch-draw 3.6s ease-in-out infinite}
@keyframes smfch-draw{40%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-110}}
#smfch .smfch-cube{transform-box:fill-box;transform-origin:center;animation:smfch-spin 9s linear infinite}
@keyframes smfch-spin{to{transform:rotate(360deg)}}
#smfch .smfch-scanline{animation:smfch-scan 3.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes smfch-scan{0%{transform:translateY(-40px)}100%{transform:translateY(240px)}}

/* Рука */
#smfch{--smfch-hh:clamp(190px,40vw,320px)}               /* высота руки */
#smfch .smfch-handzone{position:relative;width:100%;max-width:820px;height:var(--smfch-hh);margin-top:clamp(8px,2.5vw,20px)}
#smfch .smfch-hand{
  position:absolute; left:50%; bottom:0; height:100%; width:calc(var(--smfch-hh) * .5622);
  margin-left:calc(var(--smfch-hh) * -.2811);
  transform-origin:50% 100%; will-change:transform;
  mix-blend-mode:screen;                                 /* чёрный фон снимка растворяется в фоне блока */
  opacity:0; translate:0 70px; transition:opacity 1.1s ease, translate 1.2s cubic-bezier(.2,.8,.2,1);
}
#smfch.is-hand .smfch-hand{opacity:1;translate:0 0}
#smfch .smfch-hand-img{
  display:block; width:100%; height:100%; object-fit:contain; user-select:none; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent); mask-image:linear-gradient(to bottom,#000 88%,transparent);
}

@media (prefers-reduced-motion:reduce){
  #smfch *{animation:none !important}
  #smfch .smfch-title,#smfch .smfch-win,#smfch .smfch-hand{transition:none}
}
</style>

<script>
(function(){
  var root = document.getElementById('smfch');
  if (!root || root.dataset.smfInit) return;
  root.dataset.smfInit = '1';
  var ds = root.dataset;
  root.querySelector('.smfch-title').textContent = ds.title || 'Что выберешь ты?';
  root.querySelector('.smfch-win--life .smfch-cap').textContent = ds.left || 'Для себя';
  root.querySelector('.smfch-win--work .smfch-cap').textContent = ds.right || 'Для работы';

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED = parseFloat(ds.speed) || 1, TREMOR = ds.tremor === undefined ? 1.6 : parseFloat(ds.tremor);
  var hand = root.querySelector('.smfch-hand');
  var winL = root.querySelector('.smfch-win--life'), winR = root.querySelector('.smfch-win--work');
  if (ds.handSrc) root.querySelector('.smfch-hand-img').src = ds.handSrc;   // своя картинка руки по ссылке

  // Расстояние между центрами окон — от него считается размах руки
  var span = 300;
  function measure(){
    var a = winL.getBoundingClientRect(), b = winR.getBoundingClientRect();
    span = Math.max(80, (b.left + b.width / 2) - (a.left + a.width / 2));
  }
  window.addEventListener('resize', measure);

  // Ход руки: стоп под левым окном → ровно едет → стоп под правым → обратно (по кругу)
  var MOVE = (parseFloat(ds.move) || 1.8) / SPEED;   // секунд на переезд
  var HOLD = (parseFloat(ds.hold) || 1.4) / SPEED;   // секунд стоит под окном
  var CYCLE = 2 * (MOVE + HOLD);
  function ease(s){ return 0.5 - Math.cos(Math.PI * s) / 2; }       // мягкий старт и остановка, середина ровная
  function pos(t){                                                   // -1 = под левым окном, 1 = под правым
    var u = ((t % CYCLE) + CYCLE) % CYCLE;
    if (u < HOLD) return -1;
    u -= HOLD; if (u < MOVE) return -1 + 2 * ease(u / MOVE);
    u -= MOVE; if (u < HOLD) return 1;
    u -= HOLD; return 1 - 2 * ease(u / MOVE);
  }
  function tremor(t){
    return [
      (Math.sin(t * 23.1) * 0.6 + Math.sin(t * 31.7 + 1.1) * 0.4) * TREMOR,
      (Math.sin(t * 19.3 + 2.0) * 0.5 + Math.sin(t * 27.9) * 0.5) * TREMOR * 0.7
    ];
  }

  var running = false, raf = 0, last = 0;
  var elapsed = 2 * HOLD + 1.5 * MOVE;                               // старт из центра: рука как раз едет к левому окну
  function frame(now){
    if (!running) return;
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now;
    elapsed += dt;
    var t = elapsed;
    var p = pos(t), v = (pos(t + 0.03) - pos(t - 0.03)) / 0.06;      // скорость −…+
    var x = p * span * 0.5;                                          // ±половина расстояния = ровно под центром окна
    var tilt = -v * 2.2;                                             // в пути слегка отстаёт, на стопе стоит ровно
    var still = Math.max(0, 1 - Math.abs(v) * 0.9);                  // дрожь — только когда рука стоит
    var tr = tremor(t);
    hand.style.transform = 'translate3d(' + (x + tr[0] * still).toFixed(2) + 'px,' + (tr[1] * still).toFixed(2) + 'px,0) rotate(' + tilt.toFixed(2) + 'deg)';
    // подсветка окна, к которому подъехала рука
    var fl = Math.max(0, -p), fr = Math.max(0, p);
    winL.style.setProperty('--f', Math.pow(fl, 3).toFixed(3));
    winR.style.setProperty('--f', Math.pow(fr, 3).toFixed(3));
    raf = requestAnimationFrame(frame);
  }
  function play(){ if (running || reduce) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
  function pause(){ running = false; cancelAnimationFrame(raf); }

  // Режиссура появления: заголовок → окна → рука → раздумья
  var shown = false;
  function intro(){
    shown = true;
    root.classList.add('is-title');
    setTimeout(function(){ root.classList.add('is-wins'); }, reduce ? 0 : 500);
    setTimeout(function(){ root.classList.add('is-hand'); }, reduce ? 0 : 1500);
    setTimeout(function(){
      root.classList.add('is-live'); measure();
      play();
    }, reduce ? 0 : 2600);
  }

  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting && e.intersectionRatio >= 0.3){
          if (!shown) intro(); else if (root.classList.contains('is-live')) play();
        } else if (shown) pause();               // ушли с блока — рука замирает, вернулись — продолжает
      });
    }, { threshold: [0, 0.3, 0.6] });
    io.observe(root);
  } else { intro(); }
})();
</script>
